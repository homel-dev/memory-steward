# k8s/open-webui.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          imagePullPolicy: Always
          env:
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: OPENAI_API_BASE_URL
              value: "http://memory-router:8080/v1"
            - name: OPENAI_API_KEY
              value: "dummy"
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: AUDIO_STT_ENGINE
              value: "openai"
            - name: AUDIO_STT_OPENAI_API_BASE_URL
              value: "http://memory-steward-list:8001/v1"
            - name: AUDIO_STT_OPENAI_API_KEY
              value: "dummy"
            - name: AUDIO_STT_MODEL
              value: "whisper-1"
            - name: ENABLE_AUTOCOMPLETE_GENERATION
              value: "false"
            - name: ENABLE_FOLLOW_UP_GENERATION
              value: "false"
            - name: ENABLE_TITLE_GENERATION
              value: "false"
            - name: ENABLE_TAGS_GENERATION
              value: "false"
            - name: ENABLE_SEARCH_QUERY_GENERATION
              value: "false"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-token
                  key: API_TOKEN
            - name: WEBUI_AUTH
              value: "false"
            - name: DISABLE_TELEMETRY
              value: "true"
            - name: DEFAULT_USER_ROLE
              value: "user"
            - name: ENABLE_COMMUNITY_SHARING
              value: "false"
            - name: ENABLE_MESSAGE_RATING
              value: "false"
            - name: OPEN_WEBUI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-api-key
                  key: OPEN_WEBUI_API_KEY
                  optional: true
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ms
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ms
spec:
  selector:
    app: open-webui
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
