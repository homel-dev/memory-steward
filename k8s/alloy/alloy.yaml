apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: ms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-pod-reader
  namespace: ms
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-pod-reader
  namespace: ms
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: ms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-pod-reader
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: ms
data:
  config.alloy: |
    logging {
      level = "info"
    }

    discovery.kubernetes "pods" {
      role = "pod"

      namespaces {
        own_namespace = true
      }
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "service"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "__path__"
        replacement   = "/var/log/pods/*_$1/$2/*.log"
      }
    }

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets       = local.file_match.pod_logs.targets
      tail_from_end = true
      forward_to    = [loki.process.pod_logs.receiver]
    }

    loki.process "pod_logs" {
      stage.cri {}

      stage.labels {
        values = {
          namespace = "",
          pod       = "",
          container = "",
          service   = "",
        }
      }

      stage.static_labels {
        values = {
          project = "memory-steward",
        }
      }

      forward_to = [loki.write.oco.receiver]
    }

    loki.write "oco" {
      endpoint {
        url = "http://alloy.observability-backend.svc.cluster.local:12348/loki/api/v1/push"
      }
    }

    prometheus.remote_write "oco" {
      endpoint {
        url = "http://alloy.observability-backend.svc.cluster.local:12347/api/v1/metrics/write"
      }
    }

    prometheus.scrape "alloy_self" {
      targets = [
        {
          "__address__" = "127.0.0.1:12345",
          "project"     = "memory-steward",
          "namespace"   = "ms",
          "service"     = "alloy",
        },
      ]
      forward_to = [prometheus.remote_write.oco.receiver]
    }

    prometheus.scrape "qdrant" {
      targets = [
        {
          "__address__" = "qdrant:6333",
          "project"     = "memory-steward",
          "namespace"   = "ms",
          "service"     = "qdrant",
        },
      ]
      forward_to = [prometheus.remote_write.oco.receiver]
    }

    prometheus.scrape "memory_router" {
      targets = [
        {
          "__address__" = "memory-router:8080",
          "project"     = "memory-steward",
          "namespace"   = "ms",
          "service"     = "memory-router",
        },
      ]
      metrics_path = "/metrics"
      forward_to   = [prometheus.remote_write.oco.receiver]
    }

    prometheus.scrape "memory_steward_mcp" {
      targets = [
        {
          "__address__" = "memory-steward-mcp:8081",
          "project"     = "memory-steward",
          "namespace"   = "ms",
          "service"     = "memory-steward-mcp",
        },
      ]
      metrics_path = "/metrics"
      forward_to   = [prometheus.remote_write.oco.receiver]
    }

    otelcol.receiver.otlp "local" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        metrics = [otelcol.processor.batch.oco.input]
        logs    = [otelcol.processor.batch.oco.input]
        traces  = [otelcol.processor.batch.oco.input]
      }
    }

    otelcol.processor.batch "oco" {
      timeout = "5s"

      output {
        metrics = [otelcol.exporter.otlp.oco.input]
        logs    = [otelcol.exporter.otlp.oco.input]
        traces  = [otelcol.exporter.otlp.oco.input]
      }
    }

    otelcol.exporter.otlp "oco" {
      client {
        endpoint = "alloy.observability-backend.svc.cluster.local:4317"
        tls {
          insecure = true
        }
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: ms
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/component: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/component: observability
        observability.homel.dev/project: memory-steward
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.2
          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy
          ports:
            - name: http
              containerPort: 12345
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: storage
              mountPath: /var/lib/alloy
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: storage
          emptyDir: {}
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: ms
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
