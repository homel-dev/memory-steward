# k8s/backup/pg-backup-cronjob.yaml
# Nightly logical dump of Postgres -> backups PVC (custom format, restorable
# across PG major versions). Keeps the most recent 14 dumps.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
  namespace: ms
spec:
  schedule: "0 3 * * *"          # 03:00 daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: postgres:16
              env:
                # Matches postgres.yaml. For real use, source from a Secret.
                - name: PGPASSWORD
                  value: homel
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  mkdir -p /backups/pg
                  TS=$(date +%Y%m%d-%H%M%S)
                  OUT=/backups/pg/homel-$TS.dump
                  echo "Dumping -> $OUT"
                  pg_dump -h postgres -U homel -d homel -Fc -f "$OUT"
                  # Retain the newest 14 dumps.
                  ls -1t /backups/pg/homel-*.dump | tail -n +15 | xargs -r rm -f
                  echo "done: $(du -h "$OUT" | cut -f1)"
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: backups
