# k8s/tooling/serviceaccount.yaml
# Identity for ephemeral tooling Jobs. These Jobs talk to postgres/qdrant over
# the network, NOT the Kubernetes API, so NO RBAC Role is required. The SA
# exists for isolation and as a NetworkPolicy target (the export Job is the only
# workload that should ever get cloud egress; keep migrate/backup air-gapped).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: memory-tooling
  namespace: ms
# If your GHCR package is PRIVATE, create a pull secret and reference it here:
#   kubectl create secret docker-registry ghcr-pull -n ms \
#     --docker-server=ghcr.io --docker-username=<gh-user> --docker-password=<PAT>
# Then uncomment:
# imagePullSecrets:
#   - name: ghcr-pull
