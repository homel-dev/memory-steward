apiVersion: v1
kind: Service
metadata:
  name: codegraph-controller
  namespace: ms
spec:
  selector:
    app: codegraph-controller
  ports:
    - port: 8093
      targetPort: 8093
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codegraph-controller
  namespace: ms
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codegraph-worker
  namespace: ms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codegraph-controller
  namespace: ms
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codegraph-controller
  namespace: ms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codegraph-controller
subjects:
  - kind: ServiceAccount
    name: codegraph-controller
    namespace: ms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ms-codegraph-flux-source-reader
rules:
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ms-codegraph-flux-source-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ms-codegraph-flux-source-reader
subjects:
  - kind: ServiceAccount
    name: codegraph-controller
    namespace: ms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: codegraph-worker-argo-executor
  namespace: ms
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codegraph-worker-argo-executor
  namespace: ms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: codegraph-worker-argo-executor
subjects:
  - kind: ServiceAccount
    name: codegraph-worker
    namespace: ms
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codegraph-controller
  namespace: ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codegraph-controller
  template:
    metadata:
      labels:
        app: codegraph-controller
    spec:
      serviceAccountName: codegraph-controller
      initContainers:
        - name: ensure-codegraph-bucket
          image: ghcr.io/homel-dev/memory-steward/memory-steward:latest
          imagePullPolicy: Always
          command:
            - python
            - -c
            - |
              import faulthandler
              import os
              import socket
              from urllib.parse import urlparse
              from memory_steward.codegraph_worker import _minio_client

              bucket = os.environ["CODEGRAPH_GENERATION_BUCKET"]
              raw_endpoint = os.environ.get("MINIO_ENDPOINT") or "minio.host-runtime.svc.cluster.local:9000"
              parsed = urlparse(raw_endpoint if "://" in raw_endpoint else f"//{raw_endpoint}")
              host = parsed.hostname
              secure_env = os.environ.get("MINIO_SECURE")
              secure = parsed.scheme == "https" if secure_env is None else secure_env.strip().lower() in {"1", "true", "yes", "on"}
              port = parsed.port or (443 if secure else 80)

              print(f"codegraph_event=minio_dns_start host={host}", flush=True)
              addresses = socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)
              ips = ",".join(sorted({address[4][0] for address in addresses}))
              print(f"codegraph_event=minio_dns_ok host={host} ips={ips}", flush=True)
              print(f"codegraph_event=minio_tcp_start host={host} port={port}", flush=True)
              with socket.create_connection((host, port), timeout=5):
                  pass
              print(f"codegraph_event=minio_tcp_ok host={host} port={port}", flush=True)

              faulthandler.dump_traceback_later(30, repeat=False)
              client = _minio_client()
              print(f"codegraph_event=bucket_exists_start bucket={bucket}", flush=True)
              exists = client.bucket_exists(bucket)
              print(f"codegraph_event=bucket_exists_done bucket={bucket} exists={exists}", flush=True)
              if not exists:
                  print(f"codegraph_event=bucket_create_start bucket={bucket}", flush=True)
                  try:
                      client.make_bucket(bucket)
                  except Exception as exc:
                      print(f"codegraph_event=bucket_create_error bucket={bucket} error={exc!r}", flush=True)
                      print(f"codegraph_event=bucket_exists_recheck bucket={bucket}", flush=True)
                      if not client.bucket_exists(bucket):
                          raise
              faulthandler.cancel_dump_traceback_later()
              print(f"codegraph_event=bucket_ready bucket={bucket}", flush=True)
          envFrom:
            - configMapRef:
                name: homel-runtime-contract
            - secretRef:
                name: homel-codegraph
                optional: true
      containers:
        - name: controller
          image: ghcr.io/homel-dev/memory-steward/memory-steward:latest
          imagePullPolicy: Always
          command: ["python", "-m", "memory_steward.codegraph_controller"]
          ports:
            - containerPort: 8093
          envFrom:
            - configMapRef:
                name: homel-runtime-contract
            - secretRef:
                name: homel-postgres
            - secretRef:
                name: homel-codegraph
                optional: true
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CODEGRAPH_CONTROLLER_PORT
              value: "8093"
            - name: CODEGRAPH_CONTROLLER_BATCH_SIZE
              value: "16"
            - name: CODEGRAPH_CONTROLLER_POLL_SECONDS
              value: "5"
            - name: CODEGRAPH_WORKFLOW_TEMPLATE
              value: "codegraph-build"
            - name: CODEGRAPH_INDEX_PROFILE
              value: "graph-only"
            - name: CODEGRAPH_VERSION
              value: "0.20.1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8093
            initialDelaySeconds: 2
            periodSeconds: 5
