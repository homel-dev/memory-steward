apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-steward-mcp
  namespace: ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-steward-mcp
  template:
    metadata:
      labels:
        app: memory-steward-mcp
    spec:
      containers:
        - name: mcp
          image: ghcr.io/homel-dev/memory-steward/memory-steward-mcp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: sse

          # 1. Runtime Configuration (Qdrant, Limits, Hysteresis, etc.)
          envFrom:
            - configMapRef:
                name: homel-runtime-contract
            - secretRef:
                name: homel-codegraph
                optional: true

          # 2. Diagnostics Plane Access (Postgres)
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: homel-postgres
                  key: POSTGRES_DSN

            # Application name override for Postgres diagnostics.
            - name: PGDATABASE
              value: "homel"

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: memory-steward-mcp
  namespace: ms
spec:
  selector:
    app: memory-steward-mcp
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http-sse
