# k8s/runtime-contract.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: homel-runtime-contract
  namespace: ms
data:
  QDRANT_URL: "http://qdrant:6333"
  EMBEDDINGS_URL: "http://embeddings:8000"
  #BUILDER_BASE_URL: "http://vllm-builder:8000/v1"
  BUILDER_BASE_URL: "https://api.openai.com/v1"
  STEWARD_URL: "http://memory-steward:8090"
  MCP_URL: "http://memory-steward-mcp:8081/mcp"
  MAX_CONTEXT_TOKENS: "128000"
  QDRANT_COLLECTION: "homel_memory"
  RECENCY_HALF_LIFE_SECONDS: "604800"
  DENSE_PREFETCH: "25"
  TOP_K: "8"
  MIN_CONFIDENCE: "0.7"
  STATIC_MEMORY_REFRESH_SECONDS: "1800"
  HYSTERESIS_WINDOW: "8"
  OPEN_WEBUI_URL: "http://open-webui:8080"
  # OPEN_WEBUI_API_KEY is sensitive — set via secret, not here.
  # kubectl create secret generic open-webui-api-key \
  #   --from-literal=OPEN_WEBUI_API_KEY=<your-key> -n ms
