apiVersion: batch/v1
kind: Job
metadata:
  name: memory-bootstrap-restore
  namespace: ms
  annotations:
    # GitOps image promotions recreate completed, otherwise immutable Jobs.
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    spec:
      serviceAccountName: memory-tooling
      restartPolicy: Never
      containers:
        - name: restore
          image: ghcr.io/homel-dev/memory-steward/tooling:latest
          command: ["python", "/opt/tooling/bootstrap_restore.py"]
          env:
            - {name: PGHOST, value: postgres}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: homel-postgres, key: POSTGRES_USER}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: homel-postgres, key: POSTGRES_PASSWORD}
            - name: PGDATABASE
              valueFrom:
                secretKeyRef: {name: homel-postgres, key: POSTGRES_DB}
            - {name: QDRANT_URL, value: "http://qdrant:6333"}
            - {name: QDRANT_COLLECTION, value: homel_memory}
          envFrom:
            # Optional site-specific Secret; no backup means clean migrations.
            - secretRef: {name: homel-backup-restore, optional: true}
          volumeMounts:
            - {name: backups, mountPath: /backups}
      volumes:
        - name: backups
          persistentVolumeClaim: {claimName: backups}
