# Memory Steward datasource consumed by the shared OCO Grafana.
apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-steward-grafana-datasource
  namespace: ms
  labels:
    grafana_datasource: "1"
data:
  memory-steward-datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Memory Steward / Postgres
        uid: memory-steward-postgres
        type: postgres
        access: proxy
        isDefault: false
        editable: false
        url: postgres.ms.svc.cluster.local:5432
        user: homel
        secureJsonData:
          password: homel
        jsonData:
          database: homel
          sslmode: disable
          postgresVersion: 1600
          timescaledb: false
