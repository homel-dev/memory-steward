# .github/workflows/build-images.yml
name: Build & Publish images to GHCR (amd64 & arm64)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  release:
    types: [published]
  workflow_dispatch: {}
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    name: Build & push (${{ matrix.component }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: embeddings
            context: ./components/embeddings
            dockerfile: ./components/embeddings/Dockerfile
          - component: memory-router
            context: ./components/memory_router
            dockerfile: ./components/memory_router/Dockerfile
          - component: memory-steward
            context: ./components/memory_steward
            dockerfile: ./components/memory_steward/Dockerfile
          - component: memory-steward-mcp
            context: ./components/memory_steward_mcp
            dockerfile: ./components/memory_steward_mcp/Dockerfile
          - component: memory-steward-list
            context: ./components/memory_steward_list
            dockerfile: ./components/memory_steward_list/Dockerfile
          # Tooling image: migrate / backup / restore / export.
          # Context is the REPO ROOT so the Dockerfile can copy scripts/ and sql/migrations/.
          - component: tooling
            context: .
            dockerfile: ./components/tooling/Dockerfile

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          version: v0.22.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
