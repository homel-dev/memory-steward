# .github/workflows/build-images.yml
name: Runtime images

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  release:
    types: [published]
  workflow_dispatch: {}
  push:
    branches: ["main"]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  build-runtime-images:
    name: Build and publish runtime image (${{ matrix.component }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: embeddings
            context: ./components/embeddings
            dockerfile: ./components/embeddings/Dockerfile
          - component: memory-router
            context: ./components/memory_router
            dockerfile: ./components/memory_router/Dockerfile
          - component: memory-steward
            context: ./components/memory_steward
            dockerfile: ./components/memory_steward/Dockerfile
          - component: memory-steward-mcp
            context: ./components/memory_steward_mcp
            dockerfile: ./components/memory_steward_mcp/Dockerfile
          - component: steward-tui
            context: ./components/steward_tui
            dockerfile: ./components/steward_tui/Dockerfile
          - component: memory-steward-list
            context: ./components/memory_steward_list
            dockerfile: ./components/memory_steward_list/Dockerfile
          # Tooling image: migrate / backup / restore / export.
          # Context is the REPO ROOT so the Dockerfile can copy scripts/ and sql/migrations/.
          - component: tooling
            context: .
            dockerfile: ./components/tooling/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          version: v0.22.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}


  promote-runtime-images:
    name: Promote runtime image digests to GitOps manifests
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [build-runtime-images]
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin published digests and push desired state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "main advanced to $current_main; skipping stale image promotion for $GITHUB_SHA"
            exit 0
          fi
          git checkout -B main origin/main

          components=(
            embeddings
            memory-router
            memory-steward
            memory-steward-mcp
            memory-steward-list
            tooling
          )

          : > /tmp/image-pins
          for component in "${components[@]}"; do
            ref="ghcr.io/${GITHUB_REPOSITORY}/${component}:sha-${GITHUB_SHA}"
            inspect="$(docker buildx imagetools inspect "$ref")"
            digest="$(awk '$1 == "Digest:" && !found { print $2; found=1 }' <<<"$inspect")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Could not resolve digest for $ref: '$digest'" >&2
              exit 1
            fi
            printf '%s=%s\n' "$component" "$digest" >> /tmp/image-pins
          done

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          pins = dict(
              line.split("=", 1)
              for line in Path("/tmp/image-pins").read_text().splitlines()
              if line
          )
          expected = {
              "embeddings",
              "memory-router",
              "memory-steward",
              "memory-steward-mcp",
              "memory-steward-list",
              "tooling",
          }
          if set(pins) != expected:
              raise SystemExit(
                  f"unexpected image pin set: got={sorted(pins)} expected={sorted(expected)}"
              )

          repository = os.environ["GITHUB_REPOSITORY"]
          prefix = f"ghcr.io/{repository}"

          kustomization = Path("k8s/kustomization.yml")
          text = kustomization.read_text()
          for component in sorted(expected):
              name = f"{prefix}/{component}"
              pattern = re.compile(
                  rf"(^  - name: {re.escape(name)}\n)"
                  r"    (?:newTag|digest): [^\n]+\n",
                  re.MULTILINE,
              )
              text, count = pattern.subn(
                  rf"\1    digest: {pins[component]}\n",
                  text,
              )
              if count != 1:
                  raise SystemExit(
                      f"expected exactly one kustomize image pin for {name}, found {count}"
                  )
          kustomization.write_text(text)

          runtime_contract = Path("k8s/runtime-contract.yaml")
          text = runtime_contract.read_text()
          worker_image = f'{prefix}/memory-steward@{pins["memory-steward"]}'
          text, count = re.subn(
              r'(?m)^  CODEGRAPH_WORKER_IMAGE: ".*"$',
              f'  CODEGRAPH_WORKER_IMAGE: "{worker_image}"',
              text,
          )
          if count != 1:
              raise SystemExit(
                  "expected exactly one CODEGRAPH_WORKER_IMAGE pin, "
                  f"found {count}"
              )
          runtime_contract.write_text(text)
          PY

          if git diff --quiet -- k8s/kustomization.yml k8s/runtime-contract.yaml; then
            echo "GitOps manifests already reference the published runtime image digests"
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add k8s/kustomization.yml k8s/runtime-contract.yaml
          git commit -m "chore(memory-steward): promote runtime images ${GITHUB_SHA::12}"
          git push origin HEAD:main
