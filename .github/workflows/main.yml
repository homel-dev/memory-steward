name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (${{ matrix.component }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: memory-router
            path: components/memory_router
            allow_no_tests: false
          - component: memory-steward
            path: components/memory_steward
            allow_no_tests: false
          - component: memory-steward-mcp
            path: components/memory_steward_mcp
            allow_no_tests: false
          - component: memory-steward-list
            path: components/memory_steward_list
            allow_no_tests: true
          - component: embeddings
            path: components/embeddings
            allow_no_tests: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: uv sync --extra dev

      - name: Run tests
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          set +e
          uv run pytest
          rc=$?
          set -e
          # Some optional components currently have no tests; pytest returns 5.
          # Keep that explicit until tests are added rather than hiding other failures.
          if [ "$rc" -eq 5 ] && [ "${{ matrix.allow_no_tests }}" = "true" ]; then
            exit 0
          fi
          exit "$rc"

  lint:
    name: Lint (${{ matrix.component }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: memory-router
            path: components/memory_router
          - component: memory-steward
            path: components/memory_steward
          - component: memory-steward-mcp
            path: components/memory_steward_mcp
          - component: memory-steward-list
            path: components/memory_steward_list
          - component: embeddings
            path: components/embeddings

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: uv sync --extra dev

      - name: Ruff lint
        working-directory: ${{ matrix.path }}
        run: uv run ruff check src tests
