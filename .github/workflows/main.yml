# .github/workflows/main.yml
name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (${{ matrix.component }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: memory-router
            path: components/memory_router
          - component: memory-steward
            path: components/memory_steward
          - component: memory-steward-mcp
            path: components/memory_steward_mcp

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: uv sync --extra dev

      - name: Run tests
        working-directory: ${{ matrix.path }}
        run: |
          # Exit code 5 means no tests collected — not a failure
          uv run pytest || [ $? -eq 5 ]

  lint:
    name: Lint (${{ matrix.component }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: memory-router
            path: components/memory_router
          - component: memory-steward
            path: components/memory_steward
          - component: memory-steward-mcp
            path: components/memory_steward_mcp
          - component: memory-steward-list
            path: components/memory_steward_list
          - component: embeddings
            path: components/embeddings

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: uv sync --extra dev

      - name: Ruff lint
        working-directory: ${{ matrix.path }}
        run: uv run ruff check src tests --fix

      - name: Ruff format check
        working-directory: ${{ matrix.path }}
        run: uv run ruff format --check src/
