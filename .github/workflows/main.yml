name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-context:
    name: Repository context artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: homel-dev/.github/.github/workflows/repository-context.yml@main
    with:
      retention_days: 3
      include_codegraph_binary: true

  standards:
    name: Organization standards
    uses: homel-dev/.github/.github/workflows/repository-ci.yml@047391f1ac3e79ce2a9c1c74ebb1f4dfc261d8c6
    with:
      standards_ref: 047391f1ac3e79ce2a9c1c74ebb1f4dfc261d8c6
      enforce_numbered_docs: false

  test:
    name: Test (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: memory-router
            path: components/memory_router
            allow_no_tests: false
          - component: memory-steward
            path: components/memory_steward
            allow_no_tests: false
          - component: memory-steward-mcp
            path: components/memory_steward_mcp
            allow_no_tests: false
          - component: steward-tui
            path: components/steward_tui
            allow_no_tests: false
          - component: memory-steward-list
            path: components/memory_steward_list
            allow_no_tests: true
          - component: embeddings
            path: components/embeddings
            allow_no_tests: false

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.13"
          python-version: "3.14.7"

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: uv sync --extra dev

      - name: Run tests
        working-directory: ${{ matrix.path }}
        shell: bash
        run: |
          set +e
          uv run pytest
          rc=$?
          set -e
          # Some optional components currently have no tests; pytest returns 5.
          # Keep that explicit until tests are added rather than hiding other failures.
          if [ "$rc" -eq 5 ] && [ "${{ matrix.allow_no_tests }}" = "true" ]; then
            exit 0
          fi
          exit "$rc"

  lint:
    name: Lint (${{ matrix.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: memory-router
            path: components/memory_router
          - component: memory-steward
            path: components/memory_steward
          - component: memory-steward-mcp
            path: components/memory_steward_mcp
          - component: steward-tui
            path: components/steward_tui
          - component: memory-steward-list
            path: components/memory_steward_list
          - component: embeddings
            path: components/embeddings

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.13"
          python-version: "3.14.7"

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: uv sync --extra dev

      - name: Ruff lint
        working-directory: ${{ matrix.path }}
        run: uv run ruff check src tests
